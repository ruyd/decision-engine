# Seed rulesets (version 1). After first start, rules live in Postgres
# (decision_engine.ruleset) and are edited/versioned from the web app.

claim:
  default: {outcome: APPROVE, queue: auto, reason: "Clean claim: no rule fired, auto-adjudicated for payment"}
  rules:
    - id: deceased_member
      name: Service after date of death
      description: Member's date of death is before the date of service.
      condition: member.deceased_before_service
      action: {outcome: DENY, queue: eligibility, reason: "Date of service is after the member's date of death"}

    - id: no_part_b
      name: No Part B coverage
      description: Professional claims require Part B coverage in the service year.
      condition: member.partb_months == 0
      action: {outcome: DENY, queue: eligibility, reason: "Member has no Part B (medical) coverage"}

    - id: duplicate_claim
      name: Duplicate submission
      description: Same member, same date, identical procedure codes as a claim already on file.
      condition: claim.dup_count > 0
      action: {outcome: DENY, queue: payment_integrity, reason: "Duplicate of a claim already on file"}

    - id: fraud_score_siu
      name: Extreme anomaly score
      description: Claim is more unusual than 99.5% of normal claims; refer to Special Investigations.
      condition: fraud.score >= 0.995
      action: {outcome: PEND_SIU, queue: siu, reason: "Anomaly score in top 0.5% - refer to Special Investigations Unit"}

    - id: upcoding_vs_provider
      name: Possible upcoding
      description: Highest-level visit codes billed by a provider who rarely bills them, at above-normal prices.
      condition: claim.high_em_lines >= 1 and provider.high_em_share < 0.15 and claim.max_price_ratio >= 3
      action: {outcome: PEND_REVIEW, queue: payment_integrity, reason: "High-level visit code unusual for this provider, priced above norm"}

    - id: price_outlier
      name: Price outlier
      description: Two+ lines above the 95th percentile for their code, or one line at 10x+ the median.
        (6x flagged 12.5% of genuine claims in the first 1,000 simulated; 10x flags ~4%.)
      condition: claim.n_lines_above_p95 >= 2 or claim.max_price_ratio >= 10
      action: {outcome: PEND_REVIEW, queue: payment_integrity, reason: "Line prices far above the norm for these procedure codes"}

    - id: elevated_anomaly
      name: Elevated anomaly score
      description: Unusual claim (top 2%) that is also expensive.
      condition: fraud.score >= 0.98 and claim.total_paid >= 300
      action: {outcome: PEND_REVIEW, queue: payment_integrity, reason: "Unusual and costly claim - payment integrity review"}

    - id: high_dollar
      name: High-dollar claim
      description: Professional claims above $2,500 always get a human look.
      condition: claim.total_paid > 2500
      action: {outcome: PEND_REVIEW, queue: claims_review, reason: "Claim amount above $2,500 auto-pay limit"}

prior_auth:
  default: {outcome: APPROVE, queue: auto, reason: "Meets auto-approval criteria"}
  rules:
    - id: pa_deceased
      name: Member deceased
      condition: member.deceased
      action: {outcome: DENY, queue: eligibility, reason: "Member is deceased"}

    - id: pa_not_eligible
      name: Not covered for this service
      description: Inpatient needs Part A, professional/outpatient services need Part B.
      condition: (request.category == 'inpatient' and member.parta_months == 0) or (request.category != 'inpatient' and member.partb_months == 0)
      action: {outcome: DENY, queue: eligibility, reason: "Member lacks the coverage part required for this service"}

    - id: pa_high_cost
      name: High-cost procedure
      description: Expected cost of the requested service is $10,000 or more.
      condition: request.est_cost >= 10000
      action: {outcome: PEND_CLINICAL, queue: clinical_review, reason: "Expected cost >= $10,000 requires clinical review"}

    - id: pa_high_risk_member
      name: High-risk member, significant service
      description: Members in the top risk tiers get care-management review for admissions and surgery.
      condition: member.risk_tier in ['High', 'Very high'] and request.category in ['inpatient', 'surgery']
      action: {outcome: PEND_CLINICAL, queue: care_management, reason: "High predicted-cost member - route to care management"}

    - id: pa_advanced_imaging
      name: Advanced imaging needs clinical info
      description: Imaging for members with no chronic condition on file (SynPUF professional fees are small, so no $ threshold).
      condition: request.category == 'imaging' and member.n_chronic == 0
      action: {outcome: PEND_INFO, queue: clinical_review, reason: "Advanced imaging without supporting history - request clinical notes"}

    - id: pa_units
      name: Unusual quantity
      condition: request.units > 4
      action: {outcome: PEND_CLINICAL, queue: clinical_review, reason: "Requested units above typical maximum"}
