[project]
name = "decision-engine"
version = "0.1.0"
description = "Long-term medical cost estimator for underwriting, trained on CMS DE-SynPUF"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "mlflow==3.17.2",   # match the tracking server in ~/sources/medical-dw
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "shap>=0.48",
    "pyyaml>=6",
]

[tool.uv]
package = false
